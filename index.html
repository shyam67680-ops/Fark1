<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raju Mistri</title>
<link rel="preconnect" href="https://i.ytimg.com">
<style>
/* ─── config knobs ─────────────────────────────────────────────── */
:root{
  --player-top: 8px;        /* nudge the deck up/down */
  --player-w: 470px;
  --amber: #ffb02e;
  --amber-dim: #7a5312;
  --edge: 14px;             /* gap from the screen edge for the gear */
}
/* registered so the rim light can travel around the edge */
@property --ang{ syntax:'<angle>'; inherits:false; initial-value:150deg }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0b0d}
body{
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  color:#fff;
}

/* ─── background ───────────────────────────────────────────────── */
#bg,#bgv{
  position:fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  object-position:var(--focal, 50% 50%);
}
#bg{animation:drift 40s ease-in-out infinite alternate}
#bgv{opacity:0; transition:opacity .8s ease}
#bgv.live{opacity:1}
@keyframes drift{ from{transform:scale(1.03)} to{transform:scale(1.09)} }

#bg-fallback{
  position:fixed; inset:0;
  background:
    radial-gradient(120% 80% at 50% 20%, #2a3b2e 0%, #12151a 60%, #08090b 100%);
}
#vignette{
  position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(130% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.45) 100%);
}

/* ─── shared glass recipe ──────────────────────────────────────── */
.glass{
  position:relative;
  isolation:isolate;
  background:
    linear-gradient(175deg,
      rgba(255,255,255,.22) 0%,
      rgba(255,255,255,.04) 45%,
      rgba(255,255,255,.09) 100%),
    rgba(16,17,21,.36);
  backdrop-filter:blur(30px) saturate(180%) brightness(.72);
  -webkit-backdrop-filter:blur(30px) saturate(180%) brightness(.72);
  box-shadow:
    0 10px 34px -10px rgba(0,0,0,.6),
    0 2px 10px -3px rgba(0,0,0,.35);
}
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit;
  padding:1px; pointer-events:none; z-index:2;
  background:linear-gradient(var(--ang),
    rgba(255,255,255,.9), rgba(255,255,255,.18) 28%,
    rgba(255,255,255,.04) 52%, rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:turn 18s linear infinite;
}
@keyframes turn{ to{--ang:510deg} }
.glass > *{position:relative; z-index:3}

/* ─── player ───────────────────────────────────────────────────── */
#deck{
  position:fixed;
  top:calc(var(--player-top) + env(safe-area-inset-top));
  left:0; right:0; margin-inline:auto;
  width:min(var(--player-w), calc(100vw - 16px));
  border-radius:22px;
  padding:11px;
  display:flex; gap:11px; align-items:center;
  opacity:0; translate:0 -14px;
  transition:opacity .6s ease, translate .6s cubic-bezier(.2,.8,.2,1);
}
#deck.ready{opacity:1; translate:0 0}

#deck::after{
  content:""; position:absolute; inset:0 0 auto; height:48%;
  border-radius:22px 22px 40% 40% / 22px 22px 100% 100%;
  pointer-events:none; z-index:1;
  background:linear-gradient(180deg, rgba(255,255,255,.16), transparent);
}

#art{
  width:52px; height:52px; flex:none;
  border-radius:13px; object-fit:cover;
  background:rgba(255,255,255,.08);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 1px 0 rgba(255,255,255,.4),
    0 2px 8px -2px rgba(0,0,0,.5);
}

#mid{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px}

#screen{
  position:relative; overflow:hidden;
  height:18px;
  border-radius:6px;
  background:rgba(4,6,8,.62);
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 0 16px -6px rgba(255,176,46,.35),
    0 1px 0 rgba(255,255,255,.16);
  padding:0 7px;
  mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);
}
#title{
  position:absolute; top:50%; translate:0 -50%;
  white-space:nowrap;
  font:600 10.5px/1 ui-monospace,"SFMono-Regular",Menlo,monospace;
  letter-spacing:.11em; text-transform:uppercase;
  color:var(--amber); text-shadow:0 0 9px rgba(255,176,46,.55);
}

#bar{
  position:relative; height:14px; display:flex; align-items:center;
  cursor:pointer; touch-action:none;
}
#bar::before{
  content:""; position:absolute; left:0; right:0; height:3px;
  border-radius:2px;
  background:rgba(255,255,255,.16);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.12);
}
#fill{
  position:relative; height:3px; border-radius:2px; width:0%;
  background:var(--amber); box-shadow:0 0 8px rgba(255,176,46,.6);
  transition:width .1s linear;
}
#fill::after{
  content:""; position:absolute; right:-4px; top:50%; translate:0 -50%;
  width:9px; height:9px; border-radius:50%; background:#fff;
  opacity:0; transition:opacity .15s;
}
#bar:hover #fill::after{opacity:1}

#ctrls{display:flex; align-items:center; gap:2px; flex:none}
button{
  -webkit-tap-highlight-color:transparent;
  background:none; border:0; cursor:pointer; color:#fff;
  display:grid; place-items:center;
  border-radius:50%;
  font:inherit;
  transition:background .18s, box-shadow .18s, scale .12s, opacity .15s;
}
button:active{scale:.9}
button:hover{
  background:rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.ico{width:34px; height:34px}
#play{
  width:40px; height:40px;
  background:rgba(255,255,255,.17);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 0 0 1px rgba(255,255,255,.14),
    0 2px 8px -3px rgba(0,0,0,.5);
}
#play:hover{background:rgba(255,255,255,.26)}
svg{
  width:16px; height:16px; fill:currentColor; display:block;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.45));
}
#play svg{width:18px; height:18px}

#eq{display:flex; align-items:flex-end; gap:2px; height:16px; padding:0 5px 0 2px; flex:none}
#eq i{
  width:2.5px; border-radius:1px; background:var(--amber-dim);
  height:3px; transition:background .3s;
}
body.playing #eq i{
  background:var(--amber);
  animation:bounce var(--d) ease-in-out infinite alternate;
}
@keyframes bounce{from{height:3px} to{height:15px}}

/* ─── settings ─────────────────────────────────────────────────── */
#gear{
  position:fixed; z-index:12;
  right:var(--edge);
  bottom:calc(var(--edge) + env(safe-area-inset-bottom));
  width:44px; height:44px;
  border-radius:50%;
  color:rgba(255,255,255,.9);
}
#gear svg{width:19px; height:19px; transition:rotate .5s cubic-bezier(.2,.8,.2,1)}
#gear[aria-expanded="true"] svg{rotate:75deg}

/* ─── credit ───────────────────────────────────────────────────── */
#credit{
  position:fixed; z-index:12;
  left:var(--edge);
  bottom:calc(var(--edge) + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:4px;
  padding:6px 8px 6px 13px; border-radius:999px;
  font:500 11px/1 ui-sans-serif,sans-serif;
  color:rgba(255,255,255,.78);
  white-space:nowrap;
}
#credit b{font-weight:600; color:rgba(255,255,255,.95)}
#credit .links{display:flex; gap:1px; margin-left:5px}
#credit a{
  display:grid; place-items:center;
  width:26px; height:26px; border-radius:50%;
  color:rgba(255,255,255,.72);
  transition:background .18s, color .18s, scale .12s;
}
#credit a:hover{color:#fff; background:rgba(255,255,255,.15)}
#credit a:active{scale:.9}
#credit svg{width:14px; height:14px}

/* ─── telegram banner ───────────────────────────────────────────── */
#telegram-banner{
  position:fixed; z-index:11;
  left:50%; translate:-50%;
  bottom:calc(var(--edge) + 54px + env(safe-area-inset-bottom));
  padding:12px 24px; border-radius:999px;
  font:700 16px/1 ui-sans-serif,sans-serif; letter-spacing:.03em;
  color:#fff; background:rgba(0,136,204,.95);
  box-shadow:0 6px 24px -6px rgba(0,0,0,.6);
  text-decoration:none;
  display:flex; align-items:center; gap:10px;
  transition:background .2s, transform .2s;
}
#telegram-banner:hover{
  background:rgba(0,136,204,1);
  transform:translate(-50%, -3px);
  box-shadow:0 8px 32px -8px rgba(0,0,0,.7);
}
#telegram-banner svg{width:24px; height:24px; fill:currentColor}

#panel{
  position:fixed; z-index:12;
  right:var(--edge);
  bottom:calc(var(--edge) + 54px + env(safe-area-inset-bottom));
  width:min(340px, calc(100vw - var(--edge) * 2));
  border-radius:20px; padding:16px;
  opacity:0; translate:0 12px; visibility:hidden;
  transition:opacity .3s ease, translate .3s cubic-bezier(.2,.8,.2,1), visibility .3s;
}
#panel.open{opacity:1; translate:0 0; visibility:visible}

#panel h2{
  font:700 11px/1 ui-monospace,monospace;
  letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.55); margin-bottom:13px;
}
.field label{
  display:block; margin-bottom:5px;
  font:600 10px/1.4 ui-monospace,monospace;
  letter-spacing:.13em; text-transform:uppercase;
  color:rgba(255,255,255,.62);
}
.hint{
  display:block; margin-top:6px;
  font:400 10.5px/1.45 ui-sans-serif,sans-serif;
  color:rgba(255,255,255,.38);
}
input[type=text]{
  width:100%; padding:9px 11px;
  font:400 12px/1.3 ui-monospace,monospace; color:#fff;
  background:rgba(4,6,8,.5);
  border:0; border-radius:10px;
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,255,255,.09);
  outline:none;
}
input[type=text]:focus{
  box-shadow:
    inset 0 1px 3px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(255,176,46,.65),
    0 0 0 3px rgba(255,176,46,.14);
}

.row{display:flex; gap:7px; align-items:center}
.btn{
  flex:1; height:36px; border-radius:11px;
  font:600 11px/1 ui-sans-serif,sans-serif; letter-spacing:.05em;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.09);
  color:#fff; white-space:nowrap; padding:0 10px;
}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.primary{
  background:rgba(255,176,46,.9); color:#231602;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 10px -3px rgba(255,176,46,.6);
}
.btn.primary:hover{background:rgba(255,190,80,1)}
.sep{height:1px; background:rgba(255,255,255,.1); margin:15px 0 14px}

#toast{
  position:fixed; z-index:22;
  right:var(--edge);
  bottom:calc(var(--edge) + 54px + env(safe-area-inset-bottom));
  max-width:min(300px, calc(100vw - var(--edge) * 2));
  padding:9px 14px; border-radius:11px;
  font:600 11px/1.4 ui-sans-serif,sans-serif;
  background:rgba(255,176,46,.95); color:#231602;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.6);
  opacity:0; translate:0 8px; pointer-events:none;
  transition:opacity .25s, translate .25s;
}
#toast.show{opacity:1; translate:0 0}

/* ─── loader ───────────────────────────────────────────────────── */
#loader{
  position:fixed; inset:0; z-index:20;
  display:grid; place-items:center;
  background:#0b0b0d;
  text-align:center; padding:24px;
  transition:opacity .8s ease, visibility .8s;
}
#loader.gone{opacity:0; visibility:hidden; pointer-events:none}
#loader h1{
  font:800 clamp(30px,7vw,58px)/1 ui-sans-serif,sans-serif;
  letter-spacing:-.035em;
}
#loader h1 span{color:var(--amber)}
#lbar{
  width:min(200px,55vw); height:2px; margin:20px auto 0;
  border-radius:2px; background:rgba(255,255,255,.13); overflow:hidden;
}
#lbar i{
  display:block; height:100%; width:38%; border-radius:2px;
  background:var(--amber); box-shadow:0 0 10px rgba(255,176,46,.7);
  animation:slide 1.2s cubic-bezier(.6,.1,.4,.9) infinite;
}
@keyframes slide{ from{transform:translateX(-110%)} to{transform:translateX(300%)} }

@media (max-width:640px){
  :root{--player-top:6px; --edge:11px}
  #deck{padding:9px; gap:9px; border-radius:20px}
  #art{width:44px; height:44px; border-radius:11px}
  #eq{display:none}
  .ico{width:32px;height:32px}
}
</style>
</head>

<script>
const BG_VIDEO = 'public/loop.mp4';
const BG_IMAGE = 'ChatGPT Image Aug 13, 2026, 02_12_42 PM copy.png';
const MAX_WAIT = 6000;

let playlist = [
  'Dil Ka Aalam Aashiqui 128 Kbps.mp3',
  'Ek Chumma Tu Mujhko Chhote Sarkar 128 Kbps copy.mp3',
  'Mein To Hoon Pagal Baadshah 128 Kbps copy.mp3',
  'Ajnabi Mujhko Itna Bata Pyaar To Hona Hi Tha 128 Kbps.mp3',
  'Bahut Jatate Ho Chah Humse(KoshalWorld.Com).mp3',
  'Chand Se Parda(KoshalWorld.Com).mp3',
  'Chura Ke Dil Mera Main Khiladi Tu Anari 128 Kbps.mp3',
  'Dard Karaara Dum Laga Ke Haisha 128 Kbps.mp3',
  'Dil Ka Aalam Aashiqui 320 Kbps.mp3',
  'Ghoonghat Ki Aadh Se Hum Hain R'
];

let currentIndex = 0;

// Setup Background Media
const bgImg = document.getElementById('bg');
const bgVid = document.getElementById('bgv');
if(bgImg) bgImg.src = encodeURI(BG_IMAGE);
if(bgVid) {
  bgVid.src = encodeURI(BG_VIDEO);
  bgVid.oncanplay = () => bgVid.classList.add('live');
}

// Generate EQ Bars Dynamically
const eq = document.getElementById('eq');
if(eq) {
  for(let i=0; i<6; i++) {
    const bar = document.createElement('i');
    bar.style.setProperty('--d', (0.3 + i * 0.15) + 's');
    eq.appendChild(bar);
  }
}

// Loader Handling
const hideLoader = () => {
  const loader = document.getElementById('loader');
  const deck = document.getElementById('deck');
  if (loader) loader.classList.add('gone');
  if (deck) deck.classList.add('ready');
};
window.addEventListener('load', hideLoader);
setTimeout(hideLoader, MAX_WAIT);

// Audio Elements & Controls
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const playI = document.getElementById('play-i');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const muteBtn = document.getElementById('mute');
const muteI = document.getElementById('mute-i');
const title = document.getElementById('title');
const fill = document.getElementById('fill');
const progressBar = document.getElementById('bar');

const playIcon = '<path d="M7 4.5v15L20 12z"/>';
const pauseIcon = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
const speakerIcon = '<path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>';
const muteIcon = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.84 21 13.47 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H4v6h4l5 4v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM13 5.07l-2.35 2.35L13 9.77V5.07z"/>';

function loadTrack(idx) {
  if (playlist.length === 0) return;
  currentIndex = (idx + playlist.length) % playlist.length;
  audio.src = encodeURI(playlist[currentIndex]);
  if (title) title.textContent = playlist[currentIndex].replace(/\.[^/.]+$/, "");
  fill.style.width = '0%';
}

function playTrack() {
  audio.play().then(() => {
    document.body.classList.add('playing');
    playI.innerHTML = pauseIcon;
  }).catch(e => console.log('Autoplay prevented:', e));
}

function pauseTrack() {
  audio.pause();
  document.body.classList.remove('playing');
  playI.innerHTML = playIcon;
}

playBtn.addEventListener('click', () => {
  if (audio.paused) playTrack();
  else pauseTrack();
});

prevBtn.addEventListener('click', () => {
  loadTrack(currentIndex - 1);
  playTrack();
});

nextBtn.addEventListener('click', () => {
  loadTrack(currentIndex + 1);
  playTrack();
});

muteBtn.addEventListener('click', () => {
  audio.muted = !audio.muted;
  muteI.innerHTML = audio.muted ? muteIcon : speakerIcon;
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    fill.style.width = pct + '%';
  }
});

audio.addEventListener('ended', () => {
  loadTrack(currentIndex + 1);
  playTrack();
});

progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  if (audio.duration) {
    audio.currentTime = (clickX / rect.width) * audio.duration;
  }
});

// Settings Panel Logic
const gear = document.getElementById('gear');
const panel = document.getElementById('panel');
const fPlaylist = document.getElementById('f-playlist');
const saveBtn = document.getElementById('save');
const resetBtn = document.getElementById('reset');
const shareBtn = document.getElementById('share');
const toast = document.getElementById('toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

gear.addEventListener('click', () => {
  const isOpen = panel.classList.toggle('open');
  gear.setAttribute('aria-expanded', isOpen);
  if (isOpen) fPlaylist.value = playlist.join(', ');
});

saveBtn.addEventListener('click', () => {
  const val = fPlaylist.value.trim();
  if (val) {
    playlist = val.split(',').map(s => s.trim()).filter(Boolean);
    loadTrack(0);
    playTrack();
    panel.classList.remove('open');
    gear.setAttribute('aria-expanded', 'false');
    showToast('Playlist updated!');
  }
});

resetBtn.addEventListener('click', () => {
  fPlaylist.value = '';
  showToast('Cleared text input');
});

shareBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(window.location.href);
  showToast('Link copied to clipboard!');
});

// Start First Track
loadTrack(0);
</script>
